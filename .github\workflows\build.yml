name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Upgraded checkout version to remove warnings
    - uses: actions/checkout@v4.2.2

    # Upgraded Java step to eliminate the deprecation notice
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'zulu'

    # Upgraded to native action execution parameters
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.5

    # Forces an absolute fresh read to bypass any cache
    - name: Build Debug APK
      run: gradle clean assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TV-Screensaver-Manager
        path: app/build/outputs/apk/debug/app-debug.apk
