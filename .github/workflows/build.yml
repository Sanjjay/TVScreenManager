name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # UPGRADED to v4.2.2 to match new system settings
    - uses: actions/checkout@v4.2.2

    # UPGRADED to v5 to fix deprecation warnings
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'zulu'

    # UPGRADED to v4.3.0 to perfectly clear the Node warning block
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4.3.0
      with:
        gradle-version: 8.5

    # Direct injection script ensures browser cannot modify layout tags
    - name: Create Pristine Manifest File
      run: |
        mkdir -p app/src/main
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com">
            <uses-permission android:name="android.permission.WRITE_SECURE_SETTINGS" />
            <uses-feature android:name="android.software.leanback" android:required="false" />
            <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
            <queries>
                <intent>
                    <action android:name="android.service.dreams.DreamService" />
                </intent>
            </queries>
            <application
                android:allowBackup="true"
                android:label="TV Screensaver Manager"
                android:theme="@style/Theme.Leanback">
                <activity
                    android:name="com.kscreensavermanager.MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                        <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TV-Screensaver-Manager
        path: app/build/outputs/apk/debug/app-debug.apk
