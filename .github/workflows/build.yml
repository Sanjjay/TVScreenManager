name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Choose version bump type'
        required: true
        default: 'new'
        type: choice
        options:
          - new
          - patch
          - minor
          - major
      release_notes:
        description: 'Enter release notes (Leave empty for default automatic notes)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "zulu"
          
      - name: Setup Gradle Engine
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Generate Gradle Wrapper (gradlew)
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Install Android 16 SDK Component
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install

      - name: Link Android Build Tools to Expected Path
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk/build-tools
          sudo ln -s $ANDROID_HOME/build-tools/34.0.0 /usr/local/lib/android/sdk/build-tools/29.0.3

      - name: Generate Version Tag & Code
        id: versioning
        run: |
          git fetch --tags
          
          if [ "${{ github.event.inputs.version_bump }}" == "new" ]; then
            echo "Setting up a fresh first release..."
            NEW_TAG="v1.0.0"
            PURE_VERSION="1.0.0"
          else
            LATEST_TAG=$(git describe --tags `git rev-list --tags --max-count=1` 2>/dev/null || echo "v1.0.0")
            echo "Latest tag found: $LATEST_TAG"
            
            VERSION=${LATEST_TAG#v}
            IFS='.' read -r major minor patch <<< "$VERSION"
            
            if [ "${{ github.event.inputs.version_bump }}" == "major" ]; then
              major=$((major + 1)); minor=0; patch=0
            elif [ "${{ github.event.inputs.version_bump }}" == "minor" ]; then
              minor=$((minor + 1)); patch=0
            else
              patch=$((patch + 1))
            fi
            NEW_TAG="v$major.$minor.$patch"
            PURE_VERSION="$major.$minor.$patch"
          fi
          
          VERSION_CODE=$(git rev-list --count HEAD)
          
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          echo "PURE_VERSION=$PURE_VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "Final Version Selected: $NEW_TAG (Code: $VERSION_CODE)"

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            -PversionCode=${{ env.VERSION_CODE }} \
            -PversionName="${{ env.PURE_VERSION }}"
            
      - name: Sign Android APK
        id: sign_apk
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename Signed APK
        run: |
          mv ${{ steps.sign_apk.outputs.signedReleaseFile }} app/build/outputs/apk/release/TVScreenManager-${{ env.NEW_TAG }}.apk

      - name: Calculate SHA-256 Checksum
        id: calc_sha
        run: |
          APK_PATH="app/build/outputs/apk/release/TVScreenManager-${{ env.NEW_TAG }}.apk"
          SHA_VALUE=$(sha256sum "$APK_PATH" | awk '{print $1}')
          echo "sha=$SHA_VALUE" >> $GITHUB_OUTPUT

      - name: Prepare Release Notes
        id: release_notes
        run: |
          USER_NOTES="${{ github.event.inputs.release_notes }}"
          if [ -z "$USER_NOTES" ]; then
            if [ "${{ github.event.inputs.version_bump }}" == "new" ]; then
              NOTES_BODY="### Changes in ${{ env.NEW_TAG }}\n- 🎉 Initial Release!"
            else
              NOTES_BODY="### Changes in ${{ env.NEW_TAG }}\n- Automated release build.\n- Bug fixes and stability improvements."
            fi
          else
            NOTES_BODY="$USER_NOTES"
          fi
          
          SHA_FOOTER="\n\n---\n### 🔒 Build Verification\n* **TVScreenManager-${{ env.NEW_TAG }}.apk \n SHA-256:** \`${{ steps.calc_sha.outputs.sha }}\`"
          
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo -e "$NOTES_BODY$SHA_FOOTER" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create and Push Git Tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git tag ${{ env.NEW_TAG }}
          git push origin ${{ env.NEW_TAG }}

      - name: Attest Artifact
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "app/build/outputs/apk/release/TVScreenManager-${{ env.NEW_TAG }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_TAG }}
          name: ${{ env.NEW_TAG }}
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/TVScreenManager-${{ env.NEW_TAG }}.apk
