name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4.2.2

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.5

    # SAFELY CONVERTS TEXT FILE: Converts the protected text file back into a real XML file on the clean server
    - name: Convert Text to AndroidManifest
      run: |
        mkdir -p app/src/main
        cp app/src/main/manifest.txt app/src/main/AndroidManifest.xml

    - name: Build Debug APK
      run: gradle clean assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TV-Screensaver-Manager
        path: app/build/outputs/apk/debug/app-debug.apk
